[build]
  publish = "."
  functions = "netlify/functions"

# Bundle only the artwork metadata inside the Lambda zip so the
# metadata function can read it via fs in production. Artwork
# files themselves are served as static assets straight from the
# Netlify CDN (gated by netlify/edge-functions/media-gate.js) —
# no need to bundle them into a function anymore.
[functions]
  included_files = ["netlify/functions/data/**"]

# Serve the SPA from the root
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
