[build]
  publish = "."
  functions = "netlify/functions"

# Bundle the artwork images inside the Lambda zip
# so the function can read them via fs in production.
[functions]
  included_files = ["assets/drawngs/**", "netlify/functions/data/**"]

# Clean URL for the admin user-management page
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# Block direct static HTTP access to raw artwork files
[[redirects]]
  from = "/assets/drawngs/*"
  to = "/index.html"
  status = 404

# Serve the SPA from the root
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
