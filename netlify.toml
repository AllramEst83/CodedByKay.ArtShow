[build]
  publish = "."

# Artwork metadata is fetched by the frontend as a plain static file (no
# Netlify function in front of it anymore); artwork images/thumbnails are
# served entirely from Cloudflare R2 (kaysartshow.fyi). A short TTL keeps
# same-day catalog edits (a `Publish` run + deploy) showing up promptly.
[[headers]]
  for = "/data/artwork.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# CSS/JS are unversioned (no build step), so keep the TTL short: a deploy shows
# up within minutes while repeat visits still skip most requests.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Serve the SPA from the root
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
