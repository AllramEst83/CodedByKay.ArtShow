[build]
  publish = "."
  functions = "netlify/functions"

# Bundle only the artwork metadata inside the Lambda zip so the
# metadata function can read it via fs in production. Artwork
# files themselves are served as static assets straight from the
# Netlify CDN (gated by netlify/edge-functions/media-gate.js) —
# no need to bundle them into a function anymore.
[functions]
  included_files = ["netlify/functions/data/**"]

# Artwork files don't change once published — cache them at the edge for a
# year instead of revalidating on every request. If a file is ever replaced
# with different content, give it a new filename rather than overwriting the
# old one in place, so stale cached copies aren't served.
[[headers]]
  for = "/assets/drawings/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve the SPA from the root
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
