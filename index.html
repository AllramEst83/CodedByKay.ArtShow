<!DOCTYPE html>
<html lang="en" data-wall="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kay's ArtShow</title>
  <meta name="description" content="Original drawings, illustrations and portraits by Kay.">
  <meta name="author" content="Kay">
  <meta name="keywords" content="art, portfolio, drawings, portraits, illustration, Kay, ArtShow">
  <meta name="theme-color" content="#0f0f10">

  <!-- Applies the persisted wall before first paint to avoid a flash of the default wall -->
  <script>
    (function () {
      var WALLS = ['dark', 'gray', 'paper'];
      var COLORS = { dark: '#0f0f10', gray: '#a9a9ae', paper: '#f3eee4' };
      try {
        var wall = null;
        var raw = localStorage.getItem('artshow_wall');
        if (raw) { try { wall = JSON.parse(raw); } catch (e) { wall = raw; } }
        if (WALLS.indexOf(wall) === -1) {
          // Pre-redesign key; wall.js migrates and deletes it on boot.
          wall = { dark: 'dark', gray: 'gray', light: 'paper' }[localStorage.getItem('artshow-background')] || 'dark';
        }
        document.documentElement.setAttribute('data-wall', wall);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', COLORS[wall]);
      } catch (e) {}
    })();
  </script>

  <!-- Open Graph (Facebook, LinkedIn, Discord, WhatsApp, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kay's ArtShow">
  <meta property="og:title" content="Kay's ArtShow">
  <meta property="og:description" content="Original drawings, illustrations and portraits by Kay, from pencil studies to watercolor and digital work.">
  <meta property="og:url" content="https://kays-art-show.netlify.app/">
  <meta property="og:image" content="https://kays-art-show.netlify.app/assets/icons/android-chrome-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Kay's ArtShow — art portfolio">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kay's ArtShow">
  <meta name="twitter:description" content="Original drawings, illustrations and portraits by Kay, from pencil studies to watercolor and digital work.">
  <meta name="twitter:image" content="https://kays-art-show.netlify.app/assets/icons/android-chrome-512x512.png">
  <meta name="twitter:image:alt" content="Kay's ArtShow — art portfolio">
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/icons/site.webmanifest">
  <link rel="preconnect" href="https://kaysartshow.fyi" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/browse.css">
  <link rel="stylesheet" href="/css/viewer.css">
</head>
<body>
  <div id="page-loader" class="page-loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p class="loading-text">Loading Kay's ArtShow...</p>
  </div>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="/">Kay's ArtShow</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/" data-nav="work">Work</a>
      <a href="/collections" data-nav="collections">Collections</a>
    </nav>
    <div class="header-tools">
      <button id="search-toggle" type="button" class="icon-toggle" aria-label="Search" aria-expanded="false" aria-controls="search-bar" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <div id="wall-switch" class="wall-switch" role="radiogroup" aria-label="Wall colour">
        <button type="button" role="radio" aria-checked="true" data-wall-option="dark" class="wall-swatch wall-swatch--dark" aria-label="Dark wall" title="Dark"></button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-wall-option="gray" class="wall-swatch wall-swatch--gray" aria-label="Gray wall" title="Gray"></button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-wall-option="paper" class="wall-swatch wall-swatch--paper" aria-label="Paper wall" title="Paper"></button>
      </div>
    </div>
  </header>

  <div id="search-bar" class="search-bar" hidden>
    <label for="search-input" class="sr-only">Search artwork</label>
    <input type="search" id="search-input" placeholder="Search title, description, subject" autocomplete="off">
  </div>

  <main id="view" class="app-main" tabindex="-1">
    <div id="gallery-loading" class="loading-state" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text">Loading artwork...</p>
    </div>
  </main>

  <!-- Viewer: full-bleed viewing room (js/modules/viewer.js) -->
  <dialog id="viewer" class="viewer" aria-label="Artwork viewer">
    <div id="viewer-root" class="viewer-root">
      <div id="viewer-stage" class="viewer-stage">
        <div id="viewer-media" class="viewer-media">
          <img id="viewer-thumb" class="viewer-img viewer-img--thumb" alt="" hidden>
          <img id="viewer-image" class="viewer-img" alt="" hidden draggable="false">
        </div>
        <div id="viewer-video-host" class="viewer-video-host"></div>
        <div id="viewer-video-facade" class="viewer-video-facade" hidden>
          <img id="viewer-poster" class="viewer-img" alt="">
          <button id="viewer-play" type="button" class="viewer-play" aria-label="Play video">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
          </button>
        </div>
        <div id="viewer-loading" class="viewer-loading" hidden role="status" aria-label="Loading">
          <div class="spinner" aria-hidden="true"></div>
        </div>
        <div id="viewer-error" class="viewer-error" hidden role="alert">
          <p id="viewer-error-text"></p>
          <button id="viewer-retry" type="button" class="btn">Retry</button>
        </div>
      </div>

      <button id="viewer-prev" type="button" class="viewer-edge viewer-edge--prev viewer-chrome" aria-label="Previous artwork">
        <span class="viewer-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
      </button>
      <button id="viewer-next" type="button" class="viewer-edge viewer-edge--next viewer-chrome" aria-label="Next artwork">
        <span class="viewer-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </button>

      <div class="viewer-bar viewer-bar--start viewer-chrome">
        <button id="viewer-close" type="button" class="viewer-btn" aria-label="Close viewer" title="Close (Esc)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <span id="viewer-position" class="viewer-position" aria-live="polite"></span>
      </div>

      <div class="viewer-bar viewer-bar--end viewer-chrome">
        <div class="wall-switch" role="radiogroup" aria-label="Wall colour">
          <button type="button" role="radio" aria-checked="true" data-wall-option="dark" class="wall-swatch wall-swatch--dark" aria-label="Dark wall" title="Dark"></button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-wall-option="gray" class="wall-swatch wall-swatch--gray" aria-label="Gray wall" title="Gray"></button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-wall-option="paper" class="wall-swatch wall-swatch--paper" aria-label="Paper wall" title="Paper"></button>
        </div>
        <button id="viewer-zoom" type="button" class="viewer-btn" aria-label="Toggle zoom" title="Zoom (double-click, +/-)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button id="viewer-share" type="button" class="viewer-btn" aria-label="Share artwork" title="Share">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
        <button id="viewer-info-btn" type="button" class="viewer-btn" aria-label="Artwork details" aria-expanded="false" aria-controls="viewer-info" title="Details (I)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </button>
        <button id="viewer-fullscreen" type="button" class="viewer-btn" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen (F)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>

      <div class="viewer-caption viewer-chrome">
        <h2 id="viewer-title" class="viewer-title" tabindex="-1"></h2>
        <span id="viewer-year" class="viewer-year"></span>
      </div>

      <aside id="viewer-info" class="viewer-info" hidden aria-label="Artwork details">
        <div class="viewer-info__header">
          <h2 id="viewer-info-title"></h2>
          <button id="viewer-info-close" type="button" class="viewer-btn" aria-label="Close details" title="Close details">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <dl class="viewer-meta">
          <div><dt>Collection</dt><dd id="viewer-collection"></dd></div>
          <div><dt>Year</dt><dd id="viewer-date"></dd></div>
          <div><dt>Medium</dt><dd id="viewer-medium"></dd></div>
        </dl>
        <p id="viewer-desc" class="viewer-desc"></p>
        <div id="viewer-tags" class="chip-group"></div>
      </aside>
    </div>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
